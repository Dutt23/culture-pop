name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly: catch advisories published against code that hasn't changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      # npm 10's resolver crashes on vite 8 / vitest 4 optional peer chains; npm 11 handles them.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run audit:gate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # test:e2e builds dist/; prove nothing test-only shipped in it.
      - run: npm run check:dist

